# The Next.js app (WhatsApp car-booking flow + Paystack card step) on the LabourLink
# staging LKE cluster, next to the whatsapp-backend service, in the same "kanaan"
# namespace. Deploy with deploy.sh in this folder.
#
# Nothing here is public, and there is no Ingress: /api on the shared host belongs to
# another application. Meta and Paystack call the whatsapp-backend service under /kanaan,
# which verifies and logs each webhook and forwards the exact bytes and signature to this
# app in-cluster (CHAT_FLOW_URL there). The app runs without Clerk, and proxy.ts lets
# everything through when Clerk is not configured, so it must stay unrouted. Reach the
# dashboard with `kubectl -n kanaan port-forward svc/kanaan-hub 3000:80`.
#
# No image registry: the standalone build (next build with NEXT_STANDALONE=1) is copied
# onto the kanaan-hub-app volume by deploy.sh and run with stock node:22-slim.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kanaan-hub-app
  namespace: kanaan
spec:
  accessModes: ["ReadWriteOnce"]
  # Delete, not the cluster's default Retain, so removing the namespace removes the disk.
  storageClassName: linode-block-storage
  resources:
    requests:
      storage: 10Gi   # Linode's minimum volume size; the bundle itself is ~60 MB
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanaan-hub
  namespace: kanaan
  labels:
    app: kanaan-hub
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # Recreate: the volume is ReadWriteOnce, and a second pod must never run alongside.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kanaan-hub
  template:
    metadata:
      labels:
        app: kanaan-hub
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: app
          persistentVolumeClaim:
            claimName: kanaan-hub-app
        - name: tmp
          emptyDir: {}
      containers:
        - name: kanaan-hub
          image: node:22-slim
          workingDir: /app
          command: ["node", "server.js"]
          ports:
            - name: http
              containerPort: 3000
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3000" }
            - { name: HOSTNAME, value: 0.0.0.0 }
            - { name: NEXT_TELEMETRY_DISABLED, value: "1" }
          envFrom:
            - secretRef:
                name: kanaan-hub-env
          volumeMounts:
            - { name: app, mountPath: /app }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # TCP, not HTTP: every page and most APIs touch the database, and a probe should
          # not generate load or fail on a slow query.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: kanaan-hub
  namespace: kanaan
spec:
  type: ClusterIP
  selector:
    app: kanaan-hub
  ports:
    - name: http
      port: 80
      targetPort: http
---
# What Vercel's cron did: the scheduler (reminders, holds, chasing Anneli, no-shows)
# every 5 minutes, called in-cluster so /api/whatsapp/cron needs no public route.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kanaan-hub-cron
  namespace: kanaan
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
          containers:
            - name: cron
              image: curlimages/curl:8.10.1
              command: ["sh", "-c", "curl -fsS -m 100 -H \"Authorization: Bearer $CRON_SECRET\" http://kanaan-hub.kanaan.svc.cluster.local/api/whatsapp/cron"]
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: kanaan-hub-env
                      key: CRON_SECRET
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
