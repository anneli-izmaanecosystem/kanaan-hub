<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Kanaan WhatsApp Admin{% endblock %}</title>
  <style>
    :root {
      --wa-green: #075e54;
      --wa-green-light: #128c7e;
      --wa-chat-bg: #e5ddd5;
      --wa-bubble-out: #dcf8c6;
      --wa-bubble-in: #ffffff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: #f0f2f5; color: #111b21; }
    header.topbar { background: var(--wa-green); color: #fff; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
    header.topbar a { color: #fff; text-decoration: none; font-weight: 600; }
    header.topbar nav a { margin-left: 18px; opacity: 0.9; font-weight: 400; font-size: 14px; }
    .container { max-width: 960px; margin: 0 auto; padding: 20px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
    th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    th { background: #fafafa; color: #667781; font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    tr.clickable:hover { background: #f5f6f6; cursor: pointer; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .badge-APPROVED, .badge-sent, .badge-delivered, .badge-read, .badge-active { background: #d9fdd3; color: #075e54; }
    .badge-PENDING, .badge-received { background: #fef3cd; color: #8a6d0f; }
    .badge-REJECTED, .badge-failed { background: #fde2e1; color: #b3261e; }
    .badge-DRAFT, .badge-completed, .badge-abandoned { background: #e9edef; color: #667781; }
    a.plain { color: inherit; text-decoration: none; }
    .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #667781; margin: 28px 0 10px; }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="/admin">Kanaan WhatsApp Admin</a>
    <nav>
      <a href="/admin">Conversations</a>
      <a href="/admin/templates">Templates</a>
    </nav>
  </header>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
