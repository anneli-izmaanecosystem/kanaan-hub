# Template only — do not commit real values. Easiest is to create it straight from the
# service's .env (comment lines are ignored):
#
#   kubectl -n kanaan create secret generic kanaan-service-env --from-env-file=whatsapp-backend/.env
#
# Keys match app/config.py; ROOT_PATH is set on the Deployment, not here.
apiVersion: v1
kind: Secret
metadata:
  name: kanaan-service-env
  namespace: kanaan
type: Opaque
stringData:
  DATABASE_URL: ""
  WHATSAPP_PHONE_NUMBER_ID: ""
  WHATSAPP_BUSINESS_ACCOUNT_ID: ""
  WHATSAPP_ACCESS_TOKEN: ""
  WHATSAPP_APP_SECRET: ""
  WHATSAPP_VERIFY_TOKEN: ""
  WHATSAPP_API_VERSION: "v21.0"
  ADMIN_USERNAME: ""
  ADMIN_PASSWORD: ""
  INTERNAL_MIRROR_SECRET: ""
  SUPABASE_URL: ""
  SUPABASE_ANON_KEY: ""
  PAYSTACK_SECRET_KEY: ""
  PAYSTACK_CALLBACK_URL: ""
  KANAAN_HUB_DATABASE_URL: ""
  KANAAN_OPS_WHATSAPP: ""
  GOOGLE_MAPS_API_KEY: ""
