# Kanaan WhatsApp backend on the LabourLink staging LKE cluster (lke189301), served at
# https://backend-stage.labourlinksoftware.co.za/kanaan
#
# Everything lives in its own "kanaan" namespace so nothing here can collide with the
# Helm-managed LabourLink services in "default"; `kubectl delete ns kanaan` removes it all.
#
# The Ingress deliberately carries no tls block, no cert-manager annotation and no
# rewrite/regex annotations:
#   - ingress-nginx merges every Ingress for a host into one server block, so this path is
#     served over HTTPS with the certificate the existing LabourLink ingresses already
#     provide for the host; adding tls/cert-manager here would request a new certificate
#     and could change which one the whole host serves.
#   - use-regex / rewrite-target apply to *all* paths on a host in ingress-nginx, which
#     would change how /user, /auth, /media and /notification match. Instead the prefix is
#     forwarded as-is and the app strips it itself (ROOT_PATH below).
#
# No custom image: the pod runs stock python:3.12-slim, an init container unpacks the app
# code from the kanaan-service-bundle ConfigMap and pip-installs requirements.txt. Deploy
# with deploy.sh, which builds that ConfigMap and the kanaan-service-env Secret. Once an
# image can be pushed (see ../../Dockerfile), the Deployment can switch to it instead.
apiVersion: v1
kind: Namespace
metadata:
  name: kanaan
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanaan-service
  namespace: kanaan
  labels:
    app: kanaan-service
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # Recreate so a rollout never runs a second pod alongside the old one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kanaan-service
  template:
    metadata:
      labels:
        app: kanaan-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      volumes:
        - name: bundle
          configMap:
            name: kanaan-service-bundle
        - name: srv
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      initContainers:
        - name: install
          image: python:3.12-slim
          command: ["sh", "-c", "tar xzf /bundle/app.tgz -C /srv && pip install --target /srv/deps -r /srv/requirements.txt"]
          env:
            - name: HOME
              value: /tmp
            - name: PIP_NO_CACHE_DIR
              value: "1"
            - name: PIP_DISABLE_PIP_VERSION_CHECK
              value: "1"
          volumeMounts:
            - { name: bundle, mountPath: /bundle }
            - { name: srv, mountPath: /srv }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: kanaan-service
          image: python:3.12-slim
          workingDir: /srv
          command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--proxy-headers", "--forwarded-allow-ips", "*"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ROOT_PATH
              value: /kanaan
            - name: PYTHONPATH
              value: /srv/deps:/srv
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - { name: srv, mountPath: /srv }
            - { name: tmp, mountPath: /tmp }
          envFrom:
            - secretRef:
                name: kanaan-service-env
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: kanaan-service
  namespace: kanaan
spec:
  type: ClusterIP
  selector:
    app: kanaan-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kanaan-service-ingress
  namespace: kanaan
spec:
  ingressClassName: nginx
  rules:
    - host: backend-stage.labourlinksoftware.co.za
      http:
        paths:
          - path: /kanaan
            pathType: Prefix
            backend:
              service:
                name: kanaan-service
                port:
                  number: 80
